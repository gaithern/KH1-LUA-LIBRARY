name: Discord notification

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          # One Discord webhook URL per slot; unset slots are skipped
          WEBHOOK_URLS: |
            ${{ secrets.DISCORD_WEBHOOK_URL }}
            ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
            ${{ secrets.DISCORD_WEBHOOK_URL_3 }}
            ${{ secrets.DISCORD_WEBHOOK_URL_4 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(jq '.commits | length' "$GITHUB_EVENT_PATH")
          if [ "$count" -eq 0 ]; then
            echo "No commits in push event (tag/branch create?), skipping."
            exit 0
          fi
          # If this push came from a merged PR, show only branch + PR title — never commit messages
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                --jq '[.[] | select(.merged_at != null)][0] // empty' || true)
          if [ -n "$pr" ]; then
            title=$(jq -r '.head.ref + ": " + .title + " — #" + (.number|tostring)' <<<"$pr")
            url=$(jq -r '.html_url' <<<"$pr")
          else
            title="$(jq -r '.pusher.name' "$GITHUB_EVENT_PATH") pushed $count commit(s) to $(jq -r '.repository.name' "$GITHUB_EVENT_PATH"):main"
            url=$(jq -r '.compare' "$GITHUB_EVENT_PATH")
          fi
          jq -n --arg t "$title" --arg u "$url" \
            '{embeds: [{title: ($t | .[0:256]), url: $u, color: 5793266}]}' > payload.json
          echo "$WEBHOOK_URLS" | while IFS= read -r wh; do
            [ -n "$wh" ] || continue
            curl -sf -H "Content-Type: application/json" -d @payload.json "$wh"
          done
